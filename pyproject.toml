[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibemk"
dynamic = ["version"]
description = "vibeMK - CheckMK monitoring via LLM - MCP Server"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Andre", email = "chexma@gmx.de"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
keywords = ["checkmk", "monitoring", "mcp", "claude", "automation"]
dependencies = [
    "mcp>=2.0.0",
    # Imported directly to validate tool arguments; the SDK depends on it too,
    # but a direct import should not rest on someone else's dependency list.
    "jsonschema>=4.0.0",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/chexma/vibeMK"
Documentation = "https://github.com/chexma/vibeMK/blob/main/README.md"
Repository = "https://github.com/chexma/vibeMK"
Issues = "https://github.com/chexma/vibeMK/issues"

[project.scripts]
vibemk = "vibemk.server.cli:cli"

[tool.setuptools.dynamic]
version = {attr = "vibemk.config.version.__version__"}

[tool.setuptools]
# Defaults to true under pyproject.toml, which sweeps every file sitting in a
# package directory into the distribution -- including the gitignored, private
# claude.md notes. What ships is listed in package-data instead.
include-package-data = false

[tool.setuptools.packages.find]
# The src layout: one top-level package, vibemk, and nothing beside it. The
# subpackages used to be installed as api, config, handlers and utils directly
# in site-packages, where they collided with any other distribution using
# those names. Tests now import the installed package rather than whatever
# happens to sit in the working directory.
where = ["src"]
include = ["vibemk*"]
namespaces = false

[tool.setuptools.package-data]
# Only the PEP 561 marker. A blanket "*.md" shipped the gitignored, private
# claude.md notes from the package directories into the
# distribution.
"*" = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "coverage>=7.0.0",
    # Without the stubs, ignore_missing_imports turns jsonschema into Any and
    # strict mypy checks nothing about the argument validation.
    "types-jsonschema",
    # tests/test_packaging.py builds the wheel to check what is in it. Without
    # this it importorskips, and the guards against shipping scratch files
    # report green without ever running -- which is how the defects they cover
    # survived in the first place.
    "build>=1.0.0",
    # `make package` mirrors the CI package job, twine check included. Without
    # this the local mirror breaks while CI keeps passing, which defeats the
    # point of having a mirror.
    "twine>=5.0.0",
]

[tool.black]
line-length = 120
target-version = ['py310']

[tool.ruff]
line-length = 120
target-version = "py310"
# First-party code lives under src/ (and the tests beside it), which ruff's
# import sorting needs to know to agree with isort.
src = ["src", "tests"]

[tool.ruff.lint]
# These settings used to live at the top level, where ruff has not read them
# since 0.2 -- it warned on every run, and nothing ran ruff anyway. The old
# selection asked for 36 rule groups and would have reported 2181 findings,
# which is a selection nobody can act on.
#
# What is enabled here is what the code already satisfies, so CI enforces it
# from the first run and the count cannot creep back up. Groups are promoted
# out of the staged list below as their findings are cleared.
select = [
    "A",    # builtins shadowed by locals
    "B",    # bugbear: raise-without-from, unused loop variables
    "C4",   # comprehension rewrites
    "ERA",  # commented-out code
    "EXE",  # shebang without the executable bit
    "F",    # pyflakes: undefined names, unused imports, dead locals
    "I",    # import sorting (agrees with isort's black profile)
    "ICN",  # conventional import aliases
    "ISC",  # implicit string concatenation, which hides a missing comma
    "N",    # pep8 naming
    "NPY",
    "PD",
    "PGH",  # blanket noqa / type: ignore
    "PIE",  # redundant pass, repeated startswith
    "PT",   # pytest style
    "PTH",  # os.path calls that pathlib does better
    "PYI",
    "Q",    # quote style (agrees with black)
    "RSE",  # raise with unnecessary parentheses
    "T10",  # stray breakpoint()
    "T20",  # print() where a logger belongs
    "TID",  # banned relative imports
    "W",    # pycodestyle warnings
]

ignore = [
    # --- staged: real findings inside an otherwise-enabled group ---
    "F403",   # 2: star re-exports in checkmk_types/__init__.py
    "F405",   # 15: names that come from those star imports
    "F841",   # 12: assigned-and-unused locals, several of them stale reads
]

# Groups deliberately not selected, with the count each would report.
#
# DTZ was investigated and rejected rather than deferred. Its one finding
# that mattered -- a wall-clock time read as local and labelled UTC -- is
# fixed, and the rest are false alarms here: `datetime.now().timestamp()`
# converts correctly, because Python reads a naive value from now() as local,
# and the `fromtimestamp()` calls render timestamps for a human to read,
# where local is the point. Enabling it would buy noqa comments, not
# correctness.
#
# The rest, roughly in the order they are worth taking on:
#
#   SIM  8     collapsible ifs and ternaries; several of its suggestions read
#              worse than the code they replace, so this one needs judgement
#              per site rather than a sweep
#   SLF  22    private-member access, mostly in tests reaching into handlers
#   ARG  37    unused arguments, many of them interface-mandated
#   TRY  40    exception-handling style
#   E    52    line length and bare except; the bare ones are worth it
#   RUF  67    ambiguous unicode in the emoji-heavy response strings
#   G    74    logging f-strings -- 74 call sites, mechanical but noisy
#   RET  104   superfluous else-after-return
#   PL   188   pylint port; magic values and long argument lists
#   ANN  435   annotations in tests, which are deliberately untyped
#   UP   1056  Dict -> dict and friends; one mechanical sweep, huge diff

[tool.ruff.lint.per-file-ignores]
# The licence header sits above the module docstring in these, which is a
# deliberate choice, not an oversight.
"main.py" = ["E402"]
# A token missing at startup has to reach the operator's terminal, and the
# logger is not configured yet at that point. stderr is the right channel.
"src/vibemk/server/cli.py" = ["T201"]

[tool.ruff.format]
# black owns formatting; ruff is here to lint, not to fight over it.
exclude = ["*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
# The src layout: module names are resolved relative to src/, so the package
# is vibemk.api rather than src.vibemk.api.
mypy_path = "src"
# Enhanced strict mode settings
disallow_any_unimported = true
disallow_any_expr = false  # Allow Any in expressions for gradual typing
disallow_any_decorated = true
disallow_any_explicit = false  # Allow explicit Any usage
disallow_any_generics = true
disallow_subclassing_any = true
warn_unreachable = true
warn_no_return = true
warn_redundant_casts = true
show_error_codes = true
# Ignore missing imports for external libraries
ignore_missing_imports = true
# Type-check the shipped source only: build/ is a local artefact and the
# test suite is deliberately untyped.
exclude = ["^build/", "^tests/"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["vibemk"]

[tool.pytest.ini_options]
# The single source of pytest configuration. There used to be a pytest.ini
# alongside this, which pytest preferred -- and every option in it was
# silently dropped, because it carried the section header [tool:pytest], a
# form only setup.cfg understands. pytest.ini needs [pytest]. The result was
# two config files, neither of which had any effect.
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Every async test currently carries an explicit @pytest.mark.asyncio, so
# strict mode would also pass today. auto is the safer default: under strict,
# an async test that forgets the marker is skipped rather than failed, and a
# guard that silently stops running is this project's recurring failure mode.
asyncio_mode = "auto"

addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]

# No filterwarnings: the suite currently runs clean under -W default, and
# the previous config's blanket DeprecationWarning filter would have hidden
# the next one.
