name: Release

# Publishes to PyPI through Trusted Publishing: PyPI trusts this workflow, in
# this repository, running in the `pypi` environment -- there is no API token
# to store or leak. The environment requires a maintainer's approval, so a
# release only reaches PyPI once someone has clicked through.
#
# A published GitHub release triggers it. workflow_dispatch publishes a tag
# that already exists, such as one released before this workflow did.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.6.0"
        required: true

permissions:
  contents: read

# Two runs for the same tag would race to upload the same files.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      # Through the environment, never interpolated into a script: a tag name
      # is user input as far as the shell is concerned.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: The tag is a release version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag of the form vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: The tag matches the version in the code
        # A v0.6.1 tag on a commit still saying 0.6.0 would publish 0.6.0
        # under the wrong name -- or fail on PyPI after the files are built.
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('src/vibemk/config/version.py')['__version__'])")
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::tag $TAG does not match version $version in src/vibemk/config/version.py"
            exit 1
          fi

      - run: pip install build twine

      - name: Build the distribution
        run: python -m build

      - name: Check the metadata renders on PyPI
        run: twine check --strict dist/*

      - name: The installed wheel starts
        run: |
          python -m venv /tmp/release-check
          /tmp/release-check/bin/pip install --quiet dist/*.whl
          /tmp/release-check/bin/vibemk --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution
          path: dist/
          retention-days: 30

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vibemk/
    permissions:
      # The OIDC token PyPI exchanges for a short-lived upload credential.
      # Only this job has it, and only after the environment approval.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  registry:
    # Lists the release in the official MCP Registry. The registry proves the
    # PyPI package belongs to io.github.chexma by finding the mcp-name marker
    # in the README that shipped with it, and proves this repository belongs to
    # chexma through the same kind of OIDC token PyPI accepts.
    name: publish to the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Pinned like the actions are: a release downloaded by name alone runs
      # whatever was uploaded under that name today.
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish
        # The registry checks the version against PyPI, whose JSON API can
        # still answer from a cache that predates the upload a minute ago.
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "::warning::attempt $attempt failed; PyPI may not list the release yet"
            sleep 30
          done
          exit 1
