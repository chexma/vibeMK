name: Bug Report
description: Something in vibeMK behaves differently than documented
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please do not report security vulnerabilities here.** Use
        [private vulnerability reporting](https://github.com/chexma/vibeMK/security/advisories/new)
        instead, as described in [SECURITY.md](https://github.com/chexma/vibeMK/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
      placeholder: |
        I asked the model to schedule a downtime for host X and vibeMK answered ...
        I expected ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The prompt you used, or the tool call and its arguments, is usually enough.
    validations:
      required: true

  - type: input
    id: vibemk-version
    attributes:
      label: vibeMK version
      description: "From the release you installed, or the commit you are on: `git rev-parse --short HEAD`"
      placeholder: "0.5.1"
    validations:
      required: true

  - type: dropdown
    id: checkmk-version
    attributes:
      label: Checkmk version
      description: Checkmk 2.2 and older are not supported.
      options:
        - 2.5.x
        - 2.4.x
        - 2.3.x
        - 2.2.x or older (unsupported)
    validations:
      required: true

  - type: dropdown
    id: checkmk-edition
    attributes:
      label: Checkmk edition
      description: |
        Some endpoints exist only in the commercial editions — the agent bakery,
        DCD, SLA and custom graphs among them. Knowing the edition usually
        explains a "tool does not work" report straight away.
      options:
        - Raw (CRE)
        - Enterprise (CEE)
        - Cloud (CCE)
        - Managed (CME)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: How are you running vibeMK?
      options:
        - stdio (the LLM client starts it)
        - http (--transport http)
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: LLM client
      placeholder: "Claude Desktop 1.2, Claude Code, ..."
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Set `LOGFILE` to enable debug logging. Please check the output for
        host names, comments and passwords before pasting it.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/chexma/vibeMK/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
